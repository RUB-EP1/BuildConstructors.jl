name: Reusable test

on:
    workflow_call:
        inputs:
            version:
                required: false
                type: string
                default: "1"
            os:
                required: false
                type: string
                default: ubuntu-latest
            arch:
                required: false
                type: string
                default: x64
            allow_failure:
                required: false
                type: boolean
                default: false
            run_codecov:
                required: false
                type: boolean
                default: false
        secrets:
            codecov_token:
                required: true

jobs:
    test:
        name: Julia ${{ inputs.version }} - ${{ inputs.os }} - ${{ inputs.arch }} - ${{ github.event_name }}
        runs-on: ${{ inputs.os }}
        continue-on-error: ${{ inputs.allow_failure }}

        steps:
            - uses: actions/checkout@v7
            - uses: julia-actions/setup-julia@v3
              with:
                  version: ${{ inputs.version }}
                  arch: ${{ inputs.arch }}
            - name: Use Julia cache
              uses: julia-actions/cache@v3
            - uses: julia-actions/julia-buildpkg@v1
            - uses: julia-actions/julia-runtest@v1
            # Separate environment: NativeMinuit is a weak dependency and needs
            # Julia >= 1.11, so this step is skipped on the oldest supported Julia.
            - name: Test NativeMinuit integration
              if: ${{ inputs.version == '1' }}
              run: |
                  julia --project=test/native_minuit --color=yes -e 'using Pkg; Pkg.instantiate()'
                  julia --project=test/native_minuit --code-coverage=user --color=yes test/native_minuit/runtests.jl
            - uses: julia-actions/julia-processcoverage@v1
              if: ${{ inputs.run_codecov }}
            - uses: codecov/codecov-action@v7
              if: ${{ inputs.run_codecov }}
              with:
                  file: lcov.info
                  token: ${{ secrets.codecov_token }}
